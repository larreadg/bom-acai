<div class="login-wrapper">
  <div class="login-card">
    <div class="login-header">
      <img src="/bomacai.png" alt="Bom Aca&iacute;" class="login-logo" />
      <h1 class="login-title">Bom Aca&iacute;</h1>
      <p class="login-subtitle">Sistema de pedidos</p>
    </div>

    <form [formGroup]="form" (ngSubmit)="onSubmit()" class="login-form">
      <div class="field">
        <label for="username">Usuario</label>
        <input
          id="username"
          pInputText
          formControlName="username"
          placeholder="Ingres&aacute; tu usuario"
          autocomplete="username"
          [class.ng-invalid]="form.get('username')?.invalid && form.get('username')?.touched"
        />
      </div>

      <div class="field">
        <label for="password">Contrase&ntilde;a</label>
        <p-password
          inputId="password"
          formControlName="password"
          placeholder="Ingres&aacute; tu contrase&ntilde;a"
          [feedback]="false"
          [toggleMask]="true"
          styleClass="w-full"
          inputStyleClass="w-full"
          autocomplete="current-password"
        />
      </div>

      <!-- CAPTCHA -->
      <div class="field">
        <div class="captcha-label-row">
          <label for="captchaAnswer">Verificaci&oacute;n</label>
          <button
            type="button"
            class="captcha-refresh"
            title="Generar nuevo c&oacute;digo"
            [disabled]="captchaLoading"
            (click)="loadCaptcha()"
          >
            <i class="pi pi-refresh" [class.spinning]="captchaLoading"></i>
          </button>
        </div>

        <div class="captcha-image-box">
          @if (captchaLoading) {
            <div class="captcha-spinner">
              <p-progress-spinner strokeWidth="4" animationDuration=".6s" [style]="{ width: '32px', height: '32px' }" />
            </div>
          } @else if (captcha) {
            <img [src]="captcha.image" alt="C&oacute;digo de verificaci&oacute;n" class="captcha-img" />
          } @else {
            <span class="captcha-error">No se pudo cargar el c&oacute;digo.
              <button type="button" class="captcha-retry" (click)="loadCaptcha()">Reintentar</button>
            </span>
          }
        </div>

        <input
          id="captchaAnswer"
          pInputText
          formControlName="captchaAnswer"
          placeholder="Escrib&iacute; el c&oacute;digo de la imagen"
          autocomplete="off"
          [class.ng-invalid]="form.get('captchaAnswer')?.invalid && form.get('captchaAnswer')?.touched"
        />
      </div>

      @if (error) {
        <p-message severity="error">{{ error }}</p-message>
      }

      <button
        pButton
        type="submit"
        class="w-full"
        label="Iniciar sesi&oacute;n"
        icon="pi pi-sign-in"
        [loading]="loading"
        [disabled]="form.invalid || loading || !captcha"
      ></button>
    </form>
  </div>
</div>
